name: Build PokeMan Journey

on:
  workflow_dispatch:
  push:
    paths:
      - pokeman-journey-current.patch
      - pokeman-journey-v0.3.1.patch
      - pokeman-journey-cindursa.patch
      - src/data/pokemon/species_info/pokeman_journey_custom.h
      - .github/workflows/build-pokeman-journey.yml

permissions:
  contents: read

jobs:
  build:
    name: Build playable GBA
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out PKMN-World source
        uses: actions/checkout@v4

      - name: Verify version 0.3.1 patch
        run: git apply --check pokeman-journey-current.patch

      - name: Apply PokeMan Journey version 0.3.1
        run: git apply --verbose pokeman-journey-current.patch

      - name: Verify Cindursa family patch
        run: git apply --check pokeman-journey-cindursa.patch

      - name: Apply Cindursa family scaffold
        run: git apply --verbose pokeman-journey-cindursa.patch

      - name: Confirm Emerald menu, Gary starter mapping, and custom species scaffold
        run: |
          grep -Eq '^#define PW_GRAPHICAL_START_MENU[[:space:]]+FALSE' include/config/start_menu.h
          grep -Eq '^#define POKEDEX_PLUS_HGSS[[:space:]]+FALSE' include/config/pokedex_plus_hgss.h
          grep -Eq '^#define SWSH_ITEM_MENU[[:space:]]+FALSE' include/config/swsh_item_menu.h
          grep -Eq '^#define SWSH_PARTY_MENU[[:space:]]+FALSE' include/config/swsh_party_menu.h
          grep -Fq 'NEW GAME  V0.3.1' src/main_menu.c
          grep -Fq 'goto_if_eq PLAYER_STARTER_NUM, 0, PalletTown_ProfessorOaksLab_EventScript_RivalWalksToSquirtle' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'goto_if_eq PLAYER_STARTER_NUM, 1, PalletTown_ProfessorOaksLab_EventScript_RivalWalksToCharmander' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'goto_if_eq PLAYER_STARTER_NUM, 2, PalletTown_ProfessorOaksLab_EventScript_RivalWalksToBulbasaur' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'setvar RIVAL_STARTER_ID, LOCALID_SQUIRTLE_BALL' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'setvar RIVAL_STARTER_ID, LOCALID_CHARMANDER_BALL' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'setvar RIVAL_STARTER_ID, LOCALID_BULBASAUR_BALL' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'SPECIES_CINDURSA' include/constants/species.h
          grep -Fq 'SPECIES_PYROGRIZZ' include/constants/species.h
          grep -Fq 'SPECIES_INFERURSA' include/constants/species.h
          grep -Fq 'pokeman_journey_custom.h' src/data/pokemon/species_info.h
          grep -Fq '.speciesName = _("Cindursa")' src/data/pokemon/species_info/pokeman_journey_custom.h
          grep -Fq '.speciesName = _("Pyrogrizz")' src/data/pokemon/species_info/pokeman_journey_custom.h
          grep -Fq '.speciesName = _("Inferursa")' src/data/pokemon/species_info/pokeman_journey_custom.h

      - name: Install GBA compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            libelf1 \
            python3

      - name: Validate edited content
        run: |
          python3 Testing/ValidateGen13.py
          python3 Testing/ValidateScripts.py
          python3 Testing/ValidateOwMonPlacements.py
          python3 Testing/ValidateMapEvents.py
          python3 Testing/GenObstacleTable.py --check
          python3 Testing/SavePatch.py --check

      - name: Build PokeMan Journey
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc)

      - name: Verify Android-compatible version 0.3.1 ROM
        run: |
          test -f pokeman_journey_v031_fixed.gba
          ls -lh pokeman_journey_v031_fixed.gba
          sha256sum pokeman_journey_v031_fixed.gba
          python3 - <<'PY'
          from pathlib import Path
          rom = Path("pokeman_journey_v031_fixed.gba").read_bytes()
          assert len(rom) == 32 * 1024 * 1024
          assert rom[0xA0:0xAC].rstrip(b"\0 ") == b"POKEMAN V031"
          assert rom[0xAC:0xB0] == b"BPEE"
          assert rom[0xBC] == 4
          assert b"FLASH1M_V" in rom
          expected = (-(sum(rom[0xA0:0xBD]) + 0x19)) & 0xFF
          assert rom[0xBD] == expected
          print("Verified Emerald ID, Flash1M signature, revision, and checksum")
          PY

      - name: Upload playable ROM
        uses: actions/upload-artifact@v4
        with:
          name: PokeMan-Journey-Cindursa-Scaffold
          path: pokeman_journey_v031_fixed.gba
          if-no-files-found: error
          retention-days: 7
