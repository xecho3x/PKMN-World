name: Build PokeMan Journey

on:
  workflow_dispatch:
  push:
    paths:
      - pokeman-journey-current.patch
      - pokeman-journey-v0.4.patch
      - pokeman-journey-v0.4.1.patch
      - pokeman-journey-v0.4.2.patch
      - pokeman-journey-v0.4.3.patch
      - pokeman-journey-v0.4.4.patch
      - .github/workflows/build-pokeman-journey.yml

permissions:
  contents: read

jobs:
  build:
    name: Build playable GBA
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out PKMN-World source
        uses: actions/checkout@v4

      - name: Verify version 0.4.4 patch
        run: git apply --check pokeman-journey-current.patch

      - name: Apply PokeMan Journey version 0.4.4
        run: git apply --verbose pokeman-journey-current.patch

      - name: Confirm v0.4.4 regional progression and transitions
        run: |
          grep -Eq '^#define PW_GRAPHICAL_START_MENU[[:space:]]+FALSE' include/config/start_menu.h
          grep -Eq '^#define POKEDEX_PLUS_HGSS[[:space:]]+FALSE' include/config/pokedex_plus_hgss.h
          grep -Eq '^#define SWSH_ITEM_MENU[[:space:]]+FALSE' include/config/swsh_item_menu.h
          grep -Eq '^#define SWSH_PARTY_MENU[[:space:]]+FALSE' include/config/swsh_party_menu.h
          grep -Fq 'NEW GAME  V0.4.4' src/main_menu.c
          grep -Fq '[REGION_KANTO] = { SPECIES_BULBASAUR,  SPECIES_MUDKIP,    SPECIES_CYNDAQUIL}' src/starter_choose.c
          grep -Fq '[REGION_JOHTO] = { SPECIES_CHARMANDER, SPECIES_TOTODILE,  SPECIES_TREECKO' src/starter_choose.c
          grep -Fq '[REGION_HOENN] = { SPECIES_CHIKORITA,  SPECIES_TORCHIC,   SPECIES_SQUIRTLE' src/starter_choose.c
          grep -Fq 'goto_if_eq PLAYER_STARTER_NUM, 0, PalletTown_ProfessorOaksLab_EventScript_RivalWalksToCharmander' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'goto_if_eq PLAYER_STARTER_NUM, 1, PalletTown_ProfessorOaksLab_EventScript_RivalWalksToBulbasaur' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'goto_if_eq PLAYER_STARTER_NUM, 2, PalletTown_ProfessorOaksLab_EventScript_RivalWalksToSquirtle' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'setvar RIVAL_STARTER_ID, LOCALID_SQUIRTLE_BALL' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'setvar RIVAL_STARTER_ID, LOCALID_CHARMANDER_BALL' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'setvar RIVAL_STARTER_ID, LOCALID_BULBASAUR_BALL' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'setvar PLAYER_STARTER_SPECIES, SPECIES_MUDKIP' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'setvar RIVAL_STARTER_SPECIES, SPECIES_MUDKIP' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'goto_if_eq VAR_STARTER_MON_FRLG, 0, PalletTown_ProfessorOaksLab_EventScript_RivalApproachForBattleCharmander' data/maps/PalletTown_ProfessorOaksLab_Frlg/scripts.inc
          grep -Fq 'setvar PLAYER_STARTER_SPECIES, SPECIES_CHARMANDER' data/maps/NewBarkTown_Lab/scripts.inc
          grep -Fq 'setvar PLAYER_STARTER_SPECIES, SPECIES_TOTODILE' data/maps/NewBarkTown_Lab/scripts.inc
          grep -Fq 'setvar PLAYER_STARTER_SPECIES, SPECIES_TREECKO' data/maps/NewBarkTown_Lab/scripts.inc
          grep -Fq 'MAP_NEW_BARK_TOWN_PLAYERS_HOUSE_2F' data/maps/TwoIsland_Frlg/scripts.inc
          grep -Fq 'RegionHub_ScrHoennIntroDone' data/maps/OlivineCity_PortInside/scripts.inc
          grep -Fq 'MAP_LITTLEROOT_TOWN_BRENDANS_HOUSE_2F' data/maps/OlivineCity_PortInside/scripts.inc
          grep -Fq 'ScaleLevelForActiveRegion' src/regional_progression.c
          grep -Fq 'TryLearningRegionalMilestoneMove' src/pokemon.c
          grep -Fq 'givemon VAR_0x8004, 25' data/maps/CeladonCity_Gym_Frlg/scripts.inc
          grep -Fq 'givemon VAR_0x8004, 40' data/maps/CinnabarIsland_Gym_Frlg/scripts.inc
          grep -Fq 'givemon SPECIES_AERODACTYL, 35' data/maps/CinnabarIsland_PokemonLab_ExperimentRoom_Frlg/scripts.inc
          grep -Fq '"species": "SPECIES_EEVEE"' src/data/wild_encounters.json
          grep -Fq '"species": "SPECIES_DRATINI"' src/data/wild_encounters.json
          grep -Fq '"species": "SPECIES_SCYTHER"' src/data/wild_encounters.json
          grep -Fq '"species": "SPECIES_PINSIR"' src/data/wild_encounters.json

      - name: Install GBA compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            libelf1 \
            python3

      - name: Validate edited content
        run: |
          python3 Testing/ValidateGen13.py
          python3 Testing/ValidateScripts.py
          python3 Testing/ValidateOwMonPlacements.py
          python3 Testing/ValidateMapEvents.py
          python3 Testing/ValidateV04Kanto.py
          python3 Testing/GenObstacleTable.py --check
          python3 Testing/SavePatch.py --check

      - name: Build PokeMan Journey
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc)

      - name: Verify Android-compatible version 0.4.4 ROM
        run: |
          test -f pokeman_journey_v044_complete.gba
          ls -lh pokeman_journey_v044_complete.gba
          sha256sum pokeman_journey_v044_complete.gba
          python3 - <<'PY'
          from pathlib import Path
          rom = Path("pokeman_journey_v044_complete.gba").read_bytes()
          assert len(rom) == 32 * 1024 * 1024
          assert rom[0xA0:0xAC].rstrip(b"\0 ") == b"POKEMAN V044"
          assert rom[0xAC:0xB0] == b"BPEE"
          assert rom[0xBC] == 10
          assert b"FLASH1M_V" in rom
          expected = (-(sum(rom[0xA0:0xBD]) + 0x19)) & 0xFF
          assert rom[0xBD] == expected
          print("Verified Emerald ID, Flash1M signature, revision, and checksum")
          PY

      - name: Upload playable ROM
        uses: actions/upload-artifact@v4
        with:
          name: PokeMan-Journey-v0.4.4-Complete-Progression
          path: pokeman_journey_v044_complete.gba
          if-no-files-found: error
          retention-days: 14
