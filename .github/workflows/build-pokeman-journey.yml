name: Build PokeMan Journey Evolution Test
# v0.5.0 battle-evolution prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - pokeman-journey-current.patch
      - pokeman-journey-v0.5.0.patch
      - Testing/ApplyJourneyEvolutionPrototype.py
      - .github/workflows/build-pokeman-journey.yml
  push:
    paths:
      - pokeman-journey-current.patch
      - pokeman-journey-v0.5.0.patch
      - Testing/ApplyJourneyEvolutionPrototype.py
      - .github/workflows/build-pokeman-journey.yml

permissions:
  contents: read

jobs:
  build:
    name: Build playable v0.5.0 evolution test GBA
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out PKMN-World source
        uses: actions/checkout@v4

      - name: Verify v0.4.4 foundation patch
        run: git apply --check pokeman-journey-current.patch

      - name: Apply v0.4.4 foundation
        run: git apply --verbose pokeman-journey-current.patch

      - name: Verify v0.5.0 polish patch
        run: git apply --check pokeman-journey-v0.5.0.patch

      - name: Apply v0.5.0 polish
        run: git apply --verbose pokeman-journey-v0.5.0.patch

      - name: Stamp v0.5.0 playtest version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/main_menu.c")
          text = path.read_text()
          old = 'static const u8 gText_MainMenuNewGame[] = _("NEW GAME  V0.4.4");'
          new = 'static const u8 gText_MainMenuNewGame[] = _("NEW GAME  V0.5.0");'
          if old not in text:
              raise SystemExit("Expected v0.4.4 menu version marker not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Confirm v0.5.0 final playtest settings
        run: |
          grep -Eq '^#define PW_GRAPHICAL_START_MENU[[:space:]]+FALSE' include/config/start_menu.h
          grep -Eq '^#define POKEDEX_PLUS_HGSS[[:space:]]+FALSE' include/config/pokedex_plus_hgss.h
          grep -Eq '^#define SWSH_ITEM_MENU[[:space:]]+FALSE' include/config/swsh_item_menu.h
          grep -Eq '^#define SWSH_PARTY_MENU[[:space:]]+FALSE' include/config/swsh_party_menu.h
          grep -Fq 'NEW GAME  V0.5.0' src/main_menu.c
          grep -Fq '"weather": "WEATHER_NONE"' data/maps/ViridianForest_Frlg/map.json
          grep -Eq '^#define OW_ENABLE_DNS[[:space:]]+TRUE' include/config/overworld.h
          grep -Fq '[REGION_KANTO] = { SPECIES_BULBASAUR,  SPECIES_MUDKIP,    SPECIES_CYNDAQUIL}' src/starter_choose.c
          grep -Fq '[REGION_JOHTO] = { SPECIES_CHARMANDER, SPECIES_TOTODILE,  SPECIES_TREECKO' src/starter_choose.c
          grep -Fq '[REGION_HOENN] = { SPECIES_CHIKORITA,  SPECIES_TORCHIC,   SPECIES_SQUIRTLE' src/starter_choose.c
          grep -Fq 'MAP_NEW_BARK_TOWN_PLAYERS_HOUSE_2F' data/maps/TwoIsland_Frlg/scripts.inc
          grep -Fq 'RegionHub_ScrHoennIntroDone' data/maps/OlivineCity_PortInside/scripts.inc
          grep -Fq 'ScaleLevelForActiveRegion' src/regional_progression.c
          grep -Fq 'TryLearningRegionalMilestoneMove' src/pokemon.c

      - name: Install GBA compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            libelf1 \
            python3

      - name: Validate edited content
        run: |
          python3 Testing/ValidateGen13.py
          python3 Testing/ValidateScripts.py
          python3 Testing/ValidateOwMonPlacements.py
          python3 Testing/ValidateMapEvents.py
          python3 Testing/ValidateV04Kanto.py
          python3 Testing/GenObstacleTable.py --check
          python3 Testing/SavePatch.py --check

      - name: Apply Embercub battle-evolution prototype
        run: python3 Testing/ApplyJourneyEvolutionPrototype.py

      - name: Confirm evolution prototype
        run: |
          grep -Fq 'Embercub' src/data/pokemon/species_info/gen_4_families.h
          grep -Fq 'Blazebear' src/data/pokemon/species_info/gen_4_families.h
          grep -Fq '[REGION_KANTO] = { SPECIES_BULBASAUR,  SPECIES_MUDKIP,    SPECIES_LUCARIO}' src/starter_choose.c
          grep -Fq 'NEW GAME  EVO TEST' src/main_menu.c
          grep -Fq 'PokeMan Journey prototype: Embercub can battle-evolve on command' src/battle_util.c

      - name: Build PokeMan Journey v0.5.0 evolution test
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc)

      - name: Verify Android-compatible v0.5.0 ROM
        run: |
          test -f pokeman_journey_v050_fulltest.gba
          ls -lh pokeman_journey_v050_fulltest.gba
          sha256sum pokeman_journey_v050_fulltest.gba
          python3 - <<'PY'
          from pathlib import Path
          rom = Path("pokeman_journey_v050_fulltest.gba").read_bytes()
          assert len(rom) == 32 * 1024 * 1024
          assert rom[0xA0:0xAC].rstrip(b"\0 ") == b"POKEMAN V050"
          assert rom[0xAC:0xB0] == b"BPEE"
          assert rom[0xBC] == 11
          assert b"FLASH1M_V" in rom
          expected = (-(sum(rom[0xA0:0xBD]) + 0x19)) & 0xFF
          assert rom[0xBD] == expected
          print("Verified v0.5 evolution test ROM header, Flash1M signature, revision, and checksum")
          PY

      - name: Prepare evolution test ROM
        run: cp pokeman_journey_v050_fulltest.gba pokeman_journey_v050_evolution_test.gba

      - name: Upload playable evolution test ROM
        uses: actions/upload-artifact@v4
        with:
          name: PokeMan-Journey-v0.5.0-Evolution-Test
          path: pokeman_journey_v050_evolution_test.gba
          if-no-files-found: error
          retention-days: 14
